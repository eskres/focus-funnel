schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Focus Funnel: multi-user brain-dump chatbot, BYOK any OpenAI-compatible model
  provider (model-providers change; was Nebius-only under platform-foundation).
  Stack: Next.js App Router + shadcn/ui/Tailwind (frontend/), async FastAPI
  (backend/), Postgres + pgvector + SQLAlchemy/Alembic, Auth0 (auth-modes,
  proposal only as of 2026-09-22, will replace Auth0 with oidc/firebase/demo
  modes - Auth0 is still what's actually running until that change lands).
  Providers: presets (Nebius, NVIDIA, OpenRouter) plus a user-supplied custom
  base URL (Ollama, LM Studio, vLLM), each with its own encrypted key per user
  per provider (provider_keys table), capabilities declared in
  backend/app/providers.yaml, and provider-neutral errors
  (provider_key_missing/invalid/rejected, provider_unreachable,
  provider_rate_limited, provider_request_refused).
  Chat (conversation-agent change): one model per conversation, no router,
  no gates. Each turn is one streamed call with the system prompt, the
  conversation, and two tools: search_thoughts (what /pull does) and
  propose_thought (what /push does). A tool call stores nothing; a proposal
  is saved only when the user confirms the proposal card. A held proposal is
  not repeated; it comes back on a topic change, archive, and /compact.
  Commands: /push and /pull force their tool; /explore (the default mode)
  discusses; /compact summarises older turns; /delete is browser-only.
  Conversations and messages are stored per user (sidebar with resume,
  archive, restore). Models: a loadout of up to 5 provider+model entries
  with one default, reasoning effort per model, temperature in settings;
  the conversation keeps its own model and effort. chat.yaml holds the
  server's reply length cap, tool round limit, and effort table. Usage
  (tokens, estimated cost) is recorded per model call. Never fall back to
  another model.
  Rules:
  - Browser -> Next.js proxy -> private FastAPI. Token stays server-side.
  - Data is owner-scoped; another user's record returns 404.
  - Provider keys: AES-GCM, bound to user id and provider id, never returned
    or logged.
  - Errors: {"error":{"code","message"}}.
  - Thoughts and their search index live in Postgres (pgvector); the index
    is rebuildable from the thoughts table. No second store.
  - One versioned search index per user (search_indexes row). Embedding
    model comes from that row; one resolver picks it for new indexes. Never
    block per-user embedding models (first post-MVP upgrade).
  - Search priorities: speed, accuracy, and few tokens in the chat model's
    context. Hybrid (vector + full-text), exact per user, compact results.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
operations:
  apply:
    guidance:
      - "Use Conventional Commits; scope = change name, e.g. feat(platform-foundation): ..."
      - "Commit once per task group, after that group's checks pass."
      - "The first commit also adds openspec/ and the agent workflow folders (.claude/, .cline/, .clinerules/, .kilocode/), excluding ignored files."
