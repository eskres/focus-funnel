services:
  postgres:
    # Postgres 18 with the pgvector extension, which thought search needs.
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-focus_funnel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-focus_funnel}
      POSTGRES_DB: ${POSTGRES_DB:-focus_funnel}
    volumes:
      - ./.data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://focus_funnel:focus_funnel@postgres:5432/focus_funnel}
    depends_on:
      postgres:
        condition: service_healthy
    # No host port: the backend is reachable only through the frontend proxy.

  frontend:
    build: ./frontend
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
