# A public demo instance (AUTH_MODE=demo):
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up
# Postgres keeps its data in memory only, so a restart wipes every
# demo session. Leave every OIDC_* and FIREBASE_* value in .env empty: demo
# mode refuses to start with them. See docs/login.md.
services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql

  backend:
    environment:
      AUTH_MODE: demo

  frontend:
    environment:
      AUTH_MODE: demo
    # One instance only: the rate limits are kept in this process's memory.
    deploy:
      replicas: 1
