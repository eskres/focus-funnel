# The similar-thought check's test set (openspec thought-appending, design
# decision 6). Run it with:
#
#   uv run python -m app.evals.similar_thoughts --provider nebius --model <id>
#
# whenever a preset or the default embedding model is added or changed, and
# with --chat-provider/--chat-model when a chat model is added to a preset.
#
# The file is data: add cases here, no code changes needed.
#
#   pairs        a filed thought, and the same thing revisited later in other
#                words. The filed one should be among the later one's
#                candidates.
#   near_misses  a filed thought, and a later one on the same topic that is a
#                different thing. The later one should not get the card's
#                "Similar" hint. Repeated tasks are near-misses too: a task
#                done every year is a new task each year, and the app never
#                shows the hint for a task, so they count only for the model's
#                choice (--chat-model).
#   background   unrelated thoughts, so the baseline has a realistic corpus.
#
# Every filed thought and every background thought is in the corpus; each
# later thought is checked against all of them. `filed` dates are only shown
# to the chat model. Drafted synthetically; reviewed by the project owner
# before task 5.1 is ticked.

targets:
  # Share of pairs whose filed thought is among the candidates.
  recall: 0.9
  # Share of near-misses that are not tasks and get the "Similar" hint.
  false_offers: 0.1

