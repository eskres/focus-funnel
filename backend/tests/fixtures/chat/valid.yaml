temperature: { default: 0.3, min: 0.0, max: 2.0 }
reply_max_tokens: 8192
tool_rounds: 3
compact_suggest_share: 0.7
compact_keep_recent: 6
model_hint: Pick a model that supports tool calling.
efforts:
  documented: [none, minimal, low, medium, high]
  unsupported:
    - match: vendor/nano-model
      efforts: [none]
    - match: openai/gpt-oss-*
      efforts: [none, minimal]
filing:
  known_tags: 40
connectors:
  max_tools: 20
  tool_rounds: 5
  connect_seconds: 10
  call_seconds: 30
  result_max_chars: 8000
search:
  limit: 8
  candidates: 50
  rrf_k: 60
  min_similarity:
    default: 0.35
    models:
      - match: vendor/embed-*
        value: 0.6
  min_word_share: 0.6
  backfill_batch: 16
  budget_chars: 2400
  summary_chars: 400
  excerpt_chars: 240
  query_instruction:
    - match: vendor/embed-*
      text: "Instruct: find notes\nQuery:"
