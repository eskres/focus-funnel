    title: "Recipe: lentil soup"
    tags: [cooking, recipe]
    summary: >-
      Red lentil soup with cumin, lemon, and a spoon of harissa; freezes well,
      good for weekday lunches.
    raw_text: |
      Ingredients: 400 g red lentils, 1 onion, 2 carrots, 3 cloves of garlic,
      2 tsp ground cumin, 1 tbsp harissa, 1 litre vegetable stock, 1 tin of
      chopped tomatoes, juice of half a lemon.

      Soften the onion and carrots in olive oil, add garlic and cumin for a
      minute, then the lentils, tomatoes, and stock. Simmer 25 minutes, blend
      half of it, and finish with lemon juice and harissa.

