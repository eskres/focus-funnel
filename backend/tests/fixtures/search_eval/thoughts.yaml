    title: Lisbon trip
    tags: [travel]
    summary: Plan a long weekend in Lisbon in October.
    raw_text: |
      Long weekend in Lisbon, probably the second weekend of October. Flights
      on TAP from Oslo leave Friday afternoon and come back Monday morning,
      about 2,900 NOK return if booked this month.

      Places to stay: the flat near Alfama was cheaper than the hotel and has
      a terrace with a view of the river. The hotel in Baixa is more central
      but has no kitchen.

      Things to do: ride tram 28 early in the morning before it gets crowded,
      eat pastéis de Belém at the original bakery, walk up to the Miradouro da
      Senhora do Monte at sunset, and take the train to Sintra for a day if
      the weather is good.

      Budget: keep it under 8,000 NOK for everything including food.

