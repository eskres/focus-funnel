    tags: [work, bug]
    summary: >-
      The OIDC login end-to-end test fails about one run in ten; suspect the
      token refresh timer racing the redirect.
    raw_text: |
      Seen three times this week on CI. The failing step is the redirect back
      from the login provider. In the browser log the last line before the
      failure is "TokenRefreshTimer fired after navigation", which suggests the
      timer from the previous page is still alive.

      Next step: clear the timer on unmount and add a test that navigates
      during a refresh.

