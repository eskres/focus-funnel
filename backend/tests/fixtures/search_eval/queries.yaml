# Evaluation queries for thought search (openspec thought-storage, design
# decision 9). Each query lists the thoughts a good search must return
# (`expect`); an empty list means nothing in thoughts.yaml is relevant and the
# search should return nothing. `tags` and `since` are filters. `kind` says
# what the query tests:
#   exact      a word or name that appears as written
#   code       an identifier that only exact matching finds reliably
#   paraphrase different words for the same meaning
#   raw        a detail that is only in the thought's raw text
#   filter     tag and date filters
#   nothing    no relevant thought exists

queries:
  - {id: q01, kind: exact, query: milk, expect: [t01]}
  - {id: q02, kind: paraphrase, query: groceries to pick up, expect: [t01]}
