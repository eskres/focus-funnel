# Chat settings the user cannot change. Loaded once at startup; an invalid
# file stops the server. CHAT_CONFIG_PATH points tests or an operator at
# another file. This file never chooses a model for a user.

temperature:
  default: 0.3
  min: 0.0
  max: 2.0

# Sent as max_tokens on every call. Room for the worst probed reasoning
# (about 2,300 tokens) plus an answer.
reply_max_tokens: 8192

# Model calls in one turn before the answer ends with tool_loop_limit.
tool_rounds: 3

# Share of the context length past which the chat suggests /compact.
compact_suggest_share: 0.7

# Most recent messages /compact keeps as they are.
compact_keep_recent: 6

model_hint: >-
  Pick a chat model that supports tool calling and streams its answer.
  A small, fast reasoning model works well, for example
  nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B on Nebius.

efforts:
  # Every reasoning effort a user may pick, in order.
  documented: [none, minimal, low, medium, high]
  # Efforts known not to work with a model, matched on the model id with
  # shell-style wildcards. A model not listed offers every documented effort.
  unsupported:
    - match: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
      efforts: [none]   # probed: empty answers on 10 of 10 calls
    - match: openai/gpt-oss-*
      efforts: [none, minimal]   # refused by the provider

# Filing thoughts (openspec push-and-pull, design decision 6).
filing:
  # The user's tags named in the proposal tool, most used first, so the model
  # reuses them. About 100 tokens at 40.
  known_tags: 40

# Thought search (openspec thought-storage, design decisions 5, 7, and 8).
# min_similarity is provisional until the evaluation in task 6.4 sets it:
# rerun backend/scripts/search_eval.py after changing the embedding model.
# min_word_share was set from the same evaluation's words-only sweep, which
# does not depend on the model.
search:
  # Most results returned, and candidates taken from each ranking before
  # they are merged.
  limit: 8
  candidates: 50
  # Reciprocal rank fusion constant: a larger value flattens the ranking.
  rrf_k: 60
  # A thought passes if its cosine similarity reaches min_similarity, or it
  # holds at least min_word_share of the query's words (after English stop
  # words are dropped and words are reduced to their stem).
  # Similarity scales differ per model, so rules can override the default;
  # the first matching rule wins (shell-style wildcards on the model id).
  # Set from the evaluation (scripts/search_eval.py): the highest value that
  # keeps recall at 5 within 0.01 of its best. The default is unmeasured.
  min_similarity:
    default: 0.35
    models:
      # At 256 dimensions with the query instruction below; at 512 it is 0.44,
      # at 1024 0.43, and at 4096 0.42.
      - match: Qwen/Qwen3-Embedding-*
        value: 0.48
  min_word_share: 0.5
  # Missing embeddings filled in per request, within the call it makes anyway.
  backfill_batch: 16
  # The search tool's result for the model: about 4 characters a token.
  budget_chars: 2400
  summary_chars: 400
  excerpt_chars: 240
  # Some embedding models expect a task instruction before a query, and none
  # before the text they search. The first matching rule wins (shell-style
  # wildcards on the model id); a model with no rule gets the query as is.
  # Qwen3-Embedding: with it, the evaluation's "nothing" queries all come back
  # empty and unexpected results fall from 3.5 to 0.7 per query.
  query_instruction:
    - match: Qwen/Qwen3-Embedding-*
      text: "Instruct: Given a search query, retrieve the user's notes that match it\nQuery:"
